[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xps-master"
version = "0.2.0"
description = "Reproducible XPS fitting, survey analysis, model evidence, and publication figures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ali Afruz", email = "a.a.afruz@gmail.com"}]
maintainers = [{name = "Ali Afruz", email = "a.a.afruz@gmail.com"}]
keywords = ["XPS", "spectroscopy", "peak-fitting", "surface-analysis", "materials-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "olefile>=0.47",
    "PySide6-Essentials>=6.7",
    "pyqtgraph>=0.13",
    "XlsxWriter>=3.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "Pillow>=10.0",
]

[project.scripts]
xps-master-plotter = "xps_afruz.manuscript_plotter.studio:main"

[project.gui-scripts]
xps-master = "xps_afruz.ui.app:main"

[project.urls]
Homepage = "https://chemitro.ir"
Repository = "https://github.com/AliAfruz/XPS-Master"
Issues = "https://github.com/AliAfruz/XPS-Master/issues"
Zenodo = "https://doi.org/10.5281/zenodo.23323946"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: headless desktop-interface smoke tests",
]
